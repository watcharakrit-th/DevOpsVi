# Plain HTTP on the node's port 80, no host rule, so http://<NODE_IP>/ works.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: miniarcade
  namespace: miniarcade
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: miniarcade
                port:
                  name: http
