# The kubelet runs ecr-credential-provider for ECR images; it gets a registry
# token with the node's instance profile. k3s passes this file and the bin
# directory next to it to the kubelet because they sit at its default paths.
apiVersion: kubelet.config.k8s.io/v1
kind: CredentialProviderConfig
providers:
  - name: ecr-credential-provider
    matchImages:
      - "*.dkr.ecr.*.amazonaws.com"
    # ECR registry tokens are valid for 12 hours.
    defaultCacheDuration: 12h
    apiVersion: credentialprovider.kubelet.k8s.io/v1
