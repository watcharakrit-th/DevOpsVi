# ops/up.sh points ANSIBLE_CONFIG here and passes the inventory it writes to
# ~/.miniarcade/inventory.ini.
[defaults]
interpreter_python = auto_silent

[ssh_connection]
# A new node's host key is accepted on first connect and kept in a file of its
# own, which ops/down.sh deletes together with the node.
ssh_args = -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=~/.miniarcade/known_hosts -o ControlMaster=auto -o ControlPersist=60s
pipelining = True
