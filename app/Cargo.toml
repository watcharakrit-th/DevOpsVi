[package]
name = "miniarcade"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = "0.8.9"
getrandom = "0.4.3"
prometheus = { version = "0.14.0", default-features = false }
redis = { version = "1.8.1", default-features = false, features = ["tokio-comp", "connection-manager", "script"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
subtle = "2.6.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json"] }

[lints.rust]
unsafe_code = "forbid"

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
